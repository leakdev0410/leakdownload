<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><style>
body{width:220px;padding:14px;font-family:system-ui;font-size:13px;color:#333}
h3{margin:0 0 8px;font-size:15px}
.status{display:flex;align-items:center;gap:6px;margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%}
.dot.on{background:#34c759}.dot.off{background:#ccc}
.btn{width:100%;padding:8px;border:1px solid #ddd;border-radius:6px;background:#fff;cursor:pointer;font-size:12px;margin-top:8px}
.btn:hover{background:#f0f0f0}
.mono{font-family:monospace;font-size:11px;color:#666;word-break:break-all}
</style></head>
<body>
<h3>🛡 leakdownload</h3>
<div class="status"><span class="dot on"></span> Đang bắt link</div>
<p style="font-size:11px;color:#888">Mọi link tải sẽ được gửi về leakdownload app (port 19876).</p>
<button class="btn" id="testBtn">🧪 Test kết nối</button>
<p id="result" class="mono" style="margin-top:8px"></p>
<script src="popup.js"></script>
</body>
</html>
