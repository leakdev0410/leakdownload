<style>
:root{
  --accent:#E76A2E;
  --up:#1f9e8f; --ok:#3a9d4f; --warn:#d8a13a;
  --bg:oklch(0.985 0.004 70);
  --surface:#ffffff;
  --surface-2:oklch(0.975 0.004 70);
  --border:oklch(0.915 0.005 70);
  --border-2:oklch(0.945 0.004 70);
  --text:oklch(0.24 0.012 60);
  --text-2:oklch(0.50 0.01 60);
  --muted:oklch(0.62 0.008 60);
  --track:oklch(0.92 0.004 70);
  --grid:oklch(0.90 0.004 70);
  --sel:color-mix(in oklch, var(--accent) 9%, transparent);
  --sel-bd:color-mix(in oklch, var(--accent) 32%, transparent);
  --shadow:0 1px 2px rgba(20,16,10,.04), 0 8px 28px -12px rgba(20,16,10,.14);
  --radius:10px;
}
[data-theme="dark"]{
  --bg:oklch(0.18 0.006 70);
  --surface:oklch(0.215 0.006 70);
  --surface-2:oklch(0.245 0.006 70);
  --border:oklch(0.30 0.007 70);
  --border-2:oklch(0.27 0.006 70);
  --text:oklch(0.94 0.006 80);
  --text-2:oklch(0.74 0.008 75);
  --muted:oklch(0.60 0.008 75);
  --track:oklch(0.32 0.007 70);
  --grid:oklch(0.30 0.006 70);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -12px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;height:100%;}
body{
  font-family:"Hanken Grotesk",system-ui,Helvetica,Arial,sans-serif;
  background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.45;
  -webkit-font-smoothing:antialiased;
}
#root{height:100vh;}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums;}
button{font-family:inherit;cursor:pointer;}
::selection{background:color-mix(in oklch,var(--accent) 28%,transparent);}

/* ── App shell ─────────────────────────────────────────── */
.app{height:100vh;display:grid;overflow:hidden;}
.lay-side{grid-template-columns:236px 1fr;}
.lay-top{grid-template-rows:auto 1fr;}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg);}

/* ── Brand ─────────────────────────────────────────────── */
.brand{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
  background:var(--accent);color:#fff;flex:none;
  box-shadow:0 2px 8px -2px color-mix(in oklch,var(--accent) 60%,transparent);}
.brand-name{font-weight:700;font-size:18px;letter-spacing:-.02em;}
.brand-name span{color:var(--accent);}

/* ── Sidebar ───────────────────────────────────────────── */
.sidebar{background:var(--surface);border-right:1px solid var(--border);
  display:flex;flex-direction:column;padding:18px 14px;gap:18px;min-height:0;}
.nav-v{display:flex;flex-direction:column;gap:2px;}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;border:none;background:none;
  color:var(--text-2);padding:9px 11px;border-radius:8px;font-size:13.5px;font-weight:500;
  text-align:left;transition:background .12s,color .12s;}
.nav-item:hover{background:var(--surface-2);color:var(--text);}
.nav-item.active{background:var(--sel);color:var(--accent);font-weight:600;}
.nav-item.active svg{color:var(--accent);}
.nav-item svg{color:var(--muted);flex:none;}
.nav-item.active svg{color:var(--accent);}
.nav-label{flex:1;}
.nav-count{font-size:11.5px;color:var(--muted);background:var(--surface-2);
  padding:1px 7px;border-radius:20px;min-width:22px;text-align:center;}
.nav-item.active .nav-count{background:color-mix(in oklch,var(--accent) 16%,transparent);color:var(--accent);}
.side-foot{margin-top:auto;}
.mini-speed{display:flex;justify-content:space-between;font-size:12px;font-family:"JetBrains Mono",monospace;
  border-top:1px solid var(--border);padding-top:12px;}
.mini-speed .dl,.top-mini .dl{color:var(--accent);display:flex;align-items:center;gap:4px;}
.mini-speed .ul,.top-mini .ul{color:var(--up);display:flex;align-items:center;gap:4px;}

/* ── Topbar ────────────────────────────────────────────── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:26px;padding:0 20px;height:60px;}
.nav-h{display:flex;gap:4px;flex:1;}
.nav-h .nav-item{width:auto;}
.top-mini{display:flex;gap:16px;font-size:12.5px;}

/* ── Toolbar ───────────────────────────────────────────── */
.toolbar{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--border);
  background:var(--surface);}
.tb-group{display:flex;gap:6px;}
.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--surface-2);
  border:1px solid var(--border);border-radius:8px;padding:0 10px;height:34px;width:260px;color:var(--muted);}
.search input{border:none;background:none;outline:none;color:var(--text);font-size:13.5px;flex:1;font-family:inherit;}
.search input::placeholder{color:var(--muted);}

.btn{display:inline-flex;align-items:center;gap:7px;border-radius:8px;font-size:13px;font-weight:600;
  padding:0 14px;height:34px;border:1px solid transparent;transition:filter .12s,background .12s,border-color .12s;white-space:nowrap;}
.btn.primary{background:var(--accent);color:#fff;
  box-shadow:0 2px 8px -3px color-mix(in oklch,var(--accent) 70%,transparent);}
.btn.primary:hover{filter:brightness(1.06);}
.btn.primary:disabled{opacity:.45;cursor:not-allowed;filter:none;}
.btn.ghost{background:var(--surface);color:var(--text-2);border-color:var(--border);}
.btn.ghost:hover{background:var(--surface-2);color:var(--text);}

.ibtn{display:grid;place-items:center;width:30px;height:30px;border-radius:7px;border:none;
  background:none;color:var(--muted);transition:background .12s,color .12s;}
.ibtn:hover{background:var(--surface-2);color:var(--text);}
.ibtn.sm{width:22px;height:22px;}
.ibtn.danger:hover{background:color-mix(in oklch,#d6453a 14%,transparent);color:#d6453a;}

/* ── Content ───────────────────────────────────────────── */
.content{flex:1;display:flex;min-height:0;overflow:hidden;}
.list-wrap{flex:1;overflow:auto;min-width:0;}

/* ── Table ─────────────────────────────────────────────── */
.ttable{width:100%;border-collapse:collapse;font-size:13px;}
.ttable thead th{position:sticky;top:0;z-index:1;background:var(--bg);
  text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.03em;text-transform:uppercase;
  color:var(--muted);padding:11px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
.ttable th.sortable{cursor:pointer;}
.ttable th.sortable:hover{color:var(--text);}
.sort-caret{font-size:8px;margin-left:4px;color:var(--accent);}
.ttable tbody tr{border-bottom:1px solid var(--border-2);cursor:pointer;transition:background .1s;}
.ttable tbody tr:hover{background:var(--surface-2);}
.ttable tbody tr.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--accent);}
.ttable td{padding:10px 12px;vertical-align:middle;}
.ttable.compact td{padding:6px 12px;}
.ttable.compact thead th{padding:8px 12px;}
.num{text-align:right;white-space:nowrap;}
.center{text-align:center;}
.dl{color:var(--accent);}
.ul{color:var(--up);}
.cell-name{max-width:0;width:38%;}
.cell-name{display:flex;align-items:center;gap:9px;}
.cat-ico{color:var(--muted);flex:none;display:grid;place-items:center;}
.cat-ico.lg{width:34px;height:34px;border-radius:8px;background:var(--surface-2);color:var(--accent);}
.name-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;}
.cell-prog{display:flex;align-items:center;gap:9px;min-width:150px;}
.pct{font-size:11.5px;color:var(--text-2);min-width:34px;}

.bar{height:6px;border-radius:6px;background:var(--track);overflow:hidden;flex:1;min-width:80px;}
.bar-lg{height:8px;}
.bar-sm{height:5px;min-width:50px;}
.bar-fill{height:100%;border-radius:6px;transition:width .6s ease;}
.bar-fill.striped{background-image:linear-gradient(45deg,rgba(255,255,255,.28) 25%,transparent 25%,transparent 50%,rgba(255,255,255,.28) 50%,rgba(255,255,255,.28) 75%,transparent 75%);background-size:14px 14px;animation:stripe 1s linear infinite;}
@keyframes stripe{to{background-position:14px 0;}}

.ring-wrap{position:relative;display:grid;place-items:center;}
.ring-label{position:absolute;font-size:11px;font-weight:600;}

.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;white-space:nowrap;}
.pill-dot{width:7px;height:7px;border-radius:50%;flex:none;}

.row-actions{display:flex;gap:2px;opacity:0;transition:opacity .12s;}
tr:hover .row-actions,tr.sel .row-actions{opacity:1;}

/* ── Detail panel ──────────────────────────────────────── */
.detail{width:444px;flex:none;border-left:1px solid var(--border);background:var(--surface);
  display:flex;flex-direction:column;overflow:auto;}
.detail-head{display:flex;align-items:flex-start;gap:10px;padding:16px 16px 12px;border-bottom:1px solid var(--border);}
.detail-title{display:flex;gap:11px;flex:1;min-width:0;}
.detail-name{font-weight:600;font-size:14.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
.detail-sub{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px;}
.detail-progress{padding:14px 16px 10px;}
.dp-stats{display:flex;gap:7px;align-items:center;font-size:12px;color:var(--text-2);margin-top:8px;flex-wrap:wrap;}
.detail-kpis{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--border-2);
  border-top:1px solid var(--border-2);border-bottom:1px solid var(--border-2);}
.kpi{background:var(--surface);padding:11px 16px;display:flex;align-items:center;gap:10px;}
.kpi-ico{width:28px;height:28px;border-radius:7px;background:var(--surface-2);display:grid;place-items:center;color:var(--text-2);flex:none;}
.kpi-val{font-size:15px;font-weight:600;}
.kpi-lbl{font-size:11px;color:var(--muted);}
.detail-chart{padding:14px 16px 6px;}
.chart-legend{display:flex;gap:16px;font-size:11.5px;color:var(--text-2);margin-bottom:6px;}
.chart-legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle;}

.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;}
.tab{display:flex;align-items:center;gap:6px;border:none;background:none;color:var(--text-2);
  font-size:12.5px;font-weight:500;padding:11px 11px;border-bottom:2px solid transparent;margin-bottom:-1px;}
.tab:hover{color:var(--text);}
.tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600;}
.tab-n{font-size:10.5px;background:var(--surface-2);color:var(--muted);padding:0 6px;border-radius:10px;}
.tab-body{flex:1;}

.subtable{width:100%;border-collapse:collapse;font-size:12.5px;}
.subtable th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);
  font-weight:600;padding:8px 16px;border-bottom:1px solid var(--border-2);}
.subtable td{padding:7px 16px;border-bottom:1px solid var(--border-2);}
.subtable tr:hover td{background:var(--surface-2);}
.ft-name,.client{display:flex;align-items:center;gap:7px;color:var(--text-2);}
.ft-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
.ft-name svg{color:var(--muted);flex:none;}
.flag{white-space:nowrap;}
.client{font-size:11.5px;}
.tk-url{font-size:11px;max-width:0;width:50%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.tk-status{font-size:11px;font-weight:600;}
.tk-status.ok{color:var(--ok);}
.tk-status.bad{color:#d6453a;}
.prio{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;}
.prio-high{color:var(--accent);background:color-mix(in oklch,var(--accent) 13%,transparent);}
.prio-normal{color:var(--text-2);background:var(--surface-2);}
.prio-low{color:var(--muted);background:var(--surface-2);}
.empty-sm{padding:30px 16px;text-align:center;color:var(--muted);font-size:12.5px;}

.info-grid{padding:6px 0;}
.info-row{display:grid;grid-template-columns:130px 1fr;gap:12px;padding:9px 16px;border-bottom:1px solid var(--border-2);}
.info-k{color:var(--muted);font-size:12px;}
.info-v{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ── Status bar ────────────────────────────────────────── */
.statusbar{height:34px;border-top:1px solid var(--border);background:var(--surface);
  display:flex;align-items:center;gap:18px;padding:0 18px;font-size:12px;color:var(--text-2);}
.sb-item{display:flex;align-items:center;gap:6px;white-space:nowrap;}
.sb-item.dl b{color:var(--accent);}
.sb-item.ul b{color:var(--up);}
.sb-item svg{color:var(--muted);}
.sb-spacer{flex:1;}
.sb-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
.sb-dot.live{box-shadow:0 0 0 0 color-mix(in oklch,var(--ok) 60%,transparent);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in oklch,var(--ok) 55%,transparent);}70%{box-shadow:0 0 0 6px transparent;}100%{box-shadow:0 0 0 0 transparent;}}

/* ── Empty ─────────────────────────────────────────────── */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:12px;color:var(--muted);}

/* ── Modal ─────────────────────────────────────────────── */
.modal-scrim{position:fixed;inset:0;background:rgba(20,16,10,.42);backdrop-filter:blur(3px);
  display:grid;place-items:center;z-index:50;animation:fade .15s ease;}
@keyframes fade{from{opacity:0;}}
.modal{width:480px;max-width:92vw;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);
  border:1px solid var(--border);overflow:hidden;animation:pop .18s cubic-bezier(.2,.9,.3,1.2);}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0;}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);}
.modal-head h3{margin:0;font-size:16px;font-weight:700;}
.seg{display:flex;gap:4px;padding:14px 18px 0;}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-2);border-radius:8px;height:38px;font-size:13px;font-weight:600;}
.seg button.on{border-color:var(--accent);color:var(--accent);background:var(--sel);}
.modal-body{padding:16px 18px;}
.fld-lbl{display:block;font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:7px;}
.magnet-in{width:100%;height:88px;resize:none;border:1px solid var(--border);border-radius:9px;
  padding:11px;background:var(--surface-2);color:var(--text);font-size:12.5px;outline:none;}
.magnet-in:focus{border-color:var(--accent);}
.hint{font-size:11.5px;color:var(--muted);margin-top:8px;}
.dropzone{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
  border:2px dashed var(--border);border-radius:11px;padding:30px;color:var(--muted);cursor:pointer;transition:.14s;}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--sel);color:var(--accent);}
.dropzone.has{border-style:solid;border-color:var(--up);color:var(--up);}
.dz-main{font-size:14px;font-weight:600;color:var(--text);}
.dropzone.has .dz-main{color:var(--up);}
.dz-sub{font-size:11.5px;}
.modal-opts{display:flex;gap:20px;padding:0 18px 4px;}
.opt{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer;}
.opt input{accent-color:var(--accent);}
.modal-foot{display:flex;justify-content:flex-end;gap:9px;padding:16px 18px;border-top:1px solid var(--border);margin-top:8px;}

/* scrollbars */
::-webkit-scrollbar{width:11px;height:11px;}
::-webkit-scrollbar-thumb{background:var(--track);border-radius:8px;border:3px solid var(--surface);}
.list-wrap::-webkit-scrollbar-thumb{border-color:var(--bg);}
::-webkit-scrollbar-thumb:hover{background:var(--muted);}
</style>
</head>
